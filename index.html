
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08775b">
  <title>Chuyển khoản Techcombank</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 12px;
      background: #f3f6f5;
      color: #18332b;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 480px;
      margin: auto;
      padding: 20px 14px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 5px 24px #183b2b0d;
    }

    h1 {
      margin: 4px 0 22px;
      text-align: center;
      font-size: 23px;
    }

    h2 {
      margin: 24px 0 14px;
      font-size: 18px;
    }

    .account {
      padding: 18px 12px;
      border-radius: 15px;
      background: #edf7f2;
      text-align: center;
    }

    .account-name {
      color: #536a60;
      font-size: 14px;
    }

    .number {
      margin: 12px 0 18px;
      font-size: 25px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px;
      background: #08775b;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .copy-button {
      width: 100%;
    }

    #message {
      margin-bottom: 0;
      font-size: 12px;
      color: #52685e;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 15px 5px;
    }

    .bank {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      padding: 7px 1px;
      border: 1px solid #e5ebe7;
      border-radius: 11px;
      background: #fff;
      color: #263b32;
      text-decoration: none;
      text-align: center;
      overflow-wrap: anywhere;
      -webkit-tap-highlight-color: transparent;
    }

    .bank:active {
      background: #edf7f2;
      border-color: #08775b;
    }

    .logo {
      width: 39px;
      height: 39px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #edf3ef;
      color: #08775b;
      font-size: 12px;
      font-weight: 800;
      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .bank-name {
      width: 100%;
      font-size: 10px;
      line-height: 1.25;
      font-weight: 600;
    }

    .qr {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 12px auto 0;
    }

    .hint {
      color: #63746b;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 350px) {
      .logo {
        width: 32px;
        height: 32px;
      }

      .bank-name {
        font-size: 9px;
      }

      .grid {
        gap: 10px 3px;
      }
    }
  </style>
</head>

<body>
<main>
  <h1>Chuyển khoản</h1>

  <section class="account">
    <div class="account-name">Ngân hàng nhận</div>
    <h2 style="margin:8px 0">Techcombank</h2>
    <div class="number">920355130522</div>

    <button class="copy-button" onclick="copyAccount()">
      Sao chép số tài khoản
    </button>

    <p id="message"></p>
  </section>

  <h2>Chọn ngân hàng của bạn</h2>

  <div id="banks" class="grid">
    <p class="hint">Đang tải danh sách ngân hàng...</p>
  </div>

  <p class="hint">
    Chọn ngân hàng để thử mở ứng dụng. Nếu không mở được,
    hãy sử dụng mã QR bên dưới.
  </p>

  <h2>Hoặc quét mã QR</h2>

  <img
    class="qr"
    src="https://img.vietqr.io/image/TCB-920355130522-compact.png"
    alt="Mã QR Techcombank"
  >
</main>

<script>
  const fallbackBanks = [
    ["icb", "VietinBank iPay"],
    ["bidv", "BIDV SmartBanking"],
    ["ocb", "OCB OMNI"],
    ["acb", "ACB ONE"],
    ["mb", "MB Bank"],
    ["vcb", "Vietcombank"],
    ["tcb", "Techcombank"],
    ["vpb", "VPBank NEO"],
    ["vib-2", "MyVIB"],
    ["shb", "SHB SAHA"],
    ["lpb", "LPBank"],
    ["seab", "SeAMobile"],
    ["scb", "SCB Mobile"],
    ["cake", "CAKE"],
    ["hdb", "HDBank"],
    ["vba", "Agribank Plus"],
    ["tpb", "TPBank"],
    ["timo", "Timo"],
    ["vib", "MyVIB"],
    ["shbvn", "Shinhan SOL"],
    ["nab", "Nam A Bank"],
    ["abb", "ABBank"],
    ["eib", "Eximbank"],
    ["coopbank", "Co-opBank"],
    ["pvcb", "PVConnect"],
    ["wvn", "Woori WON"],
    ["klb", "KienlongBank"],
    ["bvb", "BAOVIET Smart"],
    ["vab", "VietABank"],
    ["ncb", "NCB iziMobile"],
    ["acb-biz", "ACB ONE Biz"],
    ["oceanbank", "OceanBank"],
    ["pbvn", "Public Bank"],
    ["sgicb", "SAIGONBANK"],
    ["cimb", "CIMB Octo"]
  ];

  function initials(name) {
    return name.replace(/[^A-Za-zÀ-ỹ0-9 ]/g, "")
      .split(/\s+/)
      .filter(Boolean)
      .slice(0, 2)
      .map(s => s[0])
      .join("")
      .toUpperCase();
  }

  function renderBanks(banks) {
    const container = document.getElementById("banks");
    container.replaceChildren();

    banks.forEach(bank => {
      const id = bank.appId || bank.id;
      const name = bank.appName || bank.name;
      const logoUrl = bank.appLogo || bank.logo || "";

      if (!id || !name) return;

      const link = document.createElement("a");
      link.className = "bank";
      link.href = bank.deeplink ||
        "https://dl.vietqr.io/pay?app=" + encodeURIComponent(id);
      link.setAttribute("aria-label", "Mở " + name);

      const logo = document.createElement("div");
      logo.className = "logo";

      if (logoUrl) {
        const img = document.createElement("img");
        img.src = logoUrl;
        img.alt = "";
        img.loading = "lazy";
        img.onerror = () => {
          logo.replaceChildren();
          logo.textContent = initials(name);
        };
        logo.appendChild(img);
      } else {
        logo.textContent = initials(name);
      }

      const label = document.createElement("span");
      label.className = "bank-name";
      label.textContent = name;

      link.append(logo, label);
      container.appendChild(link);
    });
  }

  async function loadBanks() {
    try {
      const response = await fetch(
        "https://api.vietqr.io/v2/android-app-deeplinks"
      );

      if (!response.ok) throw new Error("API unavailable");

      const data = await response.json();
      const apps = data.apps || data.data?.apps || [];

      if (!apps.length) throw new Error("No apps");

      renderBanks(apps);
    } catch (error) {
      renderBanks(
        fallbackBanks.map(([appId, appName]) => ({
          appId,
          appName,
          deeplink:
            "https://dl.vietqr.io/pay?app=" +
            encodeURIComponent(appId)
        }))
      );
    }
  }

  async function copyAccount() {
    try {
      await navigator.clipboard.writeText("920355130522");
      document.getElementById("message").textContent =
        "Đã sao chép số tài khoản.";
    } catch (error) {
      document.getElementById("message").textContent =
        "Không sao chép được tự động. Hãy nhấn giữ số tài khoản.";
    }
  }

  loadBanks();
</script>
</body>
</html>
